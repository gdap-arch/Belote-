 if(G.over){s.g++;if(G.sc[0]>=G.sc[1]){s.w++;s.c++;s.b=Math.max(s.b,s.c)}else s.c=0;sv('belG',null)}else sv('belG',{sc:G.sc,mode:G.mode,lvl:G.lvl,tgt:G.tgt});savP()}
function seqs(){const best=[[0,-1],[0,-1]],tot=[0,0],who=[];for(let s=0;s<4;s++)for(let k=0;k<4;k++){const rs=G.h[s].filter(c=>c.s===k).map(c=>c.r).sort((a,b)=>a-b);let i=0;while(i<rs.length){let j=i;while(j+1<rs.length&&rs[j+1]===rs[j]+1)j++;const n=j-i+1;if(n>=3){const t=s%2;tot[t]+=n>=5?100:n==4?50:20;who.push([s,n]);if(n>best[t][0]||(n==best[t][0]&&rs[j]>best[t][1]))best[t]=[n,rs[j]]}i=j+1}}
 const w=best[0][0]>best[1][0]||(best[0][0]==best[1][0]&&best[0][1]>best[1][1])?0:(best[1][0]>best[0][0]||best[1][1]>best[0][1])?1:-1;
 if(w<0||best[w][0]<3)return;G.seqPts[w]=tot[w];G.msg='Séquences : +'+tot[w]+' pour '+(w?'eux':'nous');who.filter(x=>x[0]%2==w).forEach(([s,n])=>say(s,['','','','Tierce !','Cinquante !','Cent !'][Math.min(n,5)],3400))}
function menuX(){const l=ld('belG'),T=t=>`<div class="ttl">${t}</div>`,B=(t,f,on)=>`<button class="${on?'p':''}" onclick="${f}">${t}</button>`;
 return (l?T('Partie en cours')+B(`Reprendre ${l.mode=='belote'?'Belote':'Coinche'} (${l.sc[0]}–${l.sc[1]})`,'resume()',1):'')
 +T('Joueur')+`<input value="${P.name}" maxlength="12" onchange="setName(this.value)" style="width:100px;font:inherit;padding:7px;border-radius:8px;border:1px solid #888">`+[0,1,2,3].map(i=>`<div class="av" onclick="P.av=${i};savP();render()" style="width:36px;height:36px;cursor:pointer;${P.av==i?'box-shadow:0 0 0 3px #2a6f4a':''}">${av(i)}</div>`).join('')
 +T('Tapis')+TH.map((t,i)=>B(t[0],`setTh(${i})`,P.th==i)).join('')
 +T('Vitesse')+SPD.map((s,i)=>B(s[0],`setSpd(${i})`,P.spd==s[1])).join('')

const DF=[['r','Manches gagnées',[1,5,10,25,50,100,200]],['g','Parties gagnées',[1,3,5,10,25,50]],['mk','Contrats réussis',[1,5,15,30,60,120]],['cap','Capots réalisés',[1,2,5,10,20]],['hi','Contrats de 120+ réussis',[1,3,8,15]],['co','Coinches gagnées',[1,3,6,12]],['ta','Contrats TA/SA réussis',[1,3,8,15]],['bel','Belote-rebelote',[1,5,15,40]],['seq','Séquences gagnées',[1,5,12,25]],['big','Manches à 200+ points',[1,3,8,15]],['st','Série de manches gagnées',[2,3,5,8,12]],['gb','Série de parties gagnées',[2,3,5]]];

function chk(L){const C=P.C[L];DF.forEach(d=>d[2].forEach(g=>{const id=L+'.'+d[0]+'.'+g;if(!P.ach[id]&&C[d[0]]>=g){P.ach[id]=1;toast(LVN[L]+' · '+d[1]+' : '+g)}}))}
function defis(d){const C=P.C[G.lvl],a=G.bid?G.bid.seat%2:1,won=d>0,mine=a===0&&!G.fault;
 C.rp++;if(won){C.r++;C.cs++;C.st=Math.max(C.st,C.cs)}else C.cs=0;
 if(!G.fault){if(mine&&G.made){C.mk++;if(G.bid.v>=120)C.hi++;if(G.bid.s>3)C.ta++}
  if(G.tw[0]==8)C.cap++;if(G.m>1&&(a===0)===!!G.made)C.co++;if(G.belSeen==2&&G.bel%2===0)C.bel++;if(G.seqPts&&G.seqPts[0]>0)C.seq++;if(G.sc[0]-G.prev[0]>=200)C.big++}
 if(G.over){C.gp++;if(G.sc[0]>=G.sc[1]){C.g++;C.gs++;C.gb=Math.max(C.gb,C.gs)}else C.gs=0}
 chk(G.lvl)}
function defisUI(L){L=L??P.dl??1;P.dl=L;const C=P.C[L];let tot=0,ok=0;DF.forEach(d=>d[2].forEach(g=>{tot++;if(P.ach[L+'.'+d[0]+'.'+g])ok++}));
 let h='<b>🏆 Défis</b><div style="display:flex;gap:6px;justify-content:center;margin:8px 0">'+LVN.map((n,i)=>`<button class="${i==L?'p':''}" onclick="defisUI(${i})">${n}</button>`).join('')+`</div><div style="text-align:center">${ok} / ${tot} réussis</div>`;
 DF.forEach(d=>{const m=d[2][d[2].length-1];h+=`<div style="margin-top:10px;font-weight:600">${d[1]} <small style="opacity:.7">(${Math.min(C[d[0]],m)} / ${m})</small></div><div style="display:flex;gap:4px;flex-wrap:wrap">`+d[2].map((g,i)=>{const u=P.ach[L+'.'+d[0]+'.'+g];return `<div style="flex:1 1 40px;text-align:center;padding:4px 2px;border-radius:8px;font-size:12px;background:${u?'#2a6f4a':'rgba(128,128,128,.2)'};color:${u?'#fff':'inherit'}">${u?['🥉','🥈','🥇','💎','👑'][Math.min(i,4)]:'🔒'}<br>${g}</div>`}).join('')+'</div>'});
 mod(h)}
const LVN=['Facile','Moyen','Expert','Légendaire'];
function deal3(seat,U){const o=[0,1,2,3].filter(i=>i!==seat);for(let t=0;t<30;t++){const cap={},H={};o.forEach(i=>{cap[i]=G.h[i].length;H[i]=[]});let ok=true;const u=U.slice().sort(()=>Math.random()-.5);
 for(const c of u){const el=o.filter(i=>cap[i]>0&&!G.vd[i][c.s]);if(!el.length){ok=false;break}const i=el[Math.random()*el.length|0];H[i].push(c);cap[i]--}
 if(ok)return H}return null}
function rpol(h,tr,seat){const L=legal(h,tr,seat);if(L.length==1)return L[0];
 if(!tr.length)return L.reduce((x,y)=>st(y)>st(x)?y:x);
 if(winner(tr).seat%2===seat%2)return L.reduce((x,y)=>val(y)>val(x)?y:x);
 const win=L.filter(x=>winner([...tr,{seat,c:x}]).seat===seat);
 return win.length?win.reduce((x,y)=>st(y)<st(x)?y:x):L.reduce((x,y)=>val(y)<val(x)||(val(y)==val(x)&&st(y)<st(x))?y:x)}
function roll(seat,c,H){const hs=[0,1,2,3].map(i=>i===seat?G.h[i].filter(x=>x!==c):H[i].slice()),tr=G.trick.slice(),pts=[0,0];tr.push({seat,c});let turn=(seat+1)%4;
 while(true){if(tr.length===4){const w=winner(tr);pts[w.seat%2]+=tr.reduce((a,e)=>a+val(e.c),0);if(!hs.some(x=>x.length)){pts[w.seat%2]+=10;break}tr.length=0;turn=w.seat;continue}
  const p=rpol(hs[turn],tr,turn);hs[turn].splice(hs[turn].indexOf(p),1);tr.push({seat:turn,c:p});turn=(turn+1)%4}
 return pts}
function legend(seat,L){const U=[];for(let s=0;s<4;s++)for(let r=0;r<8;r++){if(G.seen.has(s*8+r)||G.h[seat].some(c=>c.s===s&&c.r===r))continue;U.push({s,r})}
 const team=seat%2,att=G.bid.seat%2===team,at=att?team:1-team,need=G.mode==='belote'?82:G.bid.v===250?162:G.bid.v,N=Math.max(12,Math.floor(300/L.length)),sc=L.map(()=>0);
 for(let k=0;k<N;k++){let H=deal3(seat,U);if(!H){H={};const u=U.slice().sort(()=>Math.random()-.5);let j=0;[0,1,2,3].filter(i=>i!==seat).forEach(i=>{H[i]=u.slice(j,j+G.h[i].length);j+=G.h[i].length})}
  L.forEach((c,i)=>{const p=roll(seat,c,H),made=G.pts[at]+p[at]>=need;sc[i]+=p[team]-p[1-team]+(made===att?25:-25)})}
 return L[sc.indexOf(Math.max(...sc))]}
const LN=[['Rapide 300',300],['Rapide 500',500],['Classique 1000',1000]];function setLen(n){P.len=n;savP();render()}
function menu(){G.ph='menu';G.msg='Choisis la difficulté et le jeu';G.turn=-1;G.bid=null;G.trick=[];G.h=[[],[],[],[]];G.sc=[0,0];G.up=null;G.log=['','','',''];render()}

function bidB(seat,s){
 if(s<0){G.log[seat]='Passe';G.pass++;say(seat,['Je passe','Passe !','Pas pour moi','Rien à dire'][Math.random()*4|0]);
  if(G.pass>=4){if(G.round==1){G.round=2;G.pass=0;G.turn=(G.dealer+1)%4;G.log=['','','',''];G.msg='Deuxième tour : choisissez une autre couleur';render();return next()}
   G.msg='Tout le monde passe : on redistribue';G.turn=-1;G.ph='redeal';render();return void setTimeout(newRound,2600)}}
 else{G.bid={v:0,s,seat};G.log[seat]='Prend '+S[s];say(seat,G.round==1?'Je prends !':'Je prends '+S[s]);return takeB()}
 G.turn=(G.turn+1)%4;render();next()}
function takeB(){const b=G.bid,h=G.h;h[b.seat].push(G.up,...G.rest.slice(0,2));let k=2;for(let i=1;i<4;i++){h[(b.seat+i)%4].push(...G.rest.slice(k,k+3));k+=3}
 G.tr=b.s;G.m=1;G.msg='';G.h.forEach(sortH);G.ph='deal';G.turn=-1;render();setTimeout(startPlay,1500)}
function botBidB(seat){if(G.lvl==0&&Math.random()<.2)return bidB(seat,-1);const h=G.h[seat],u=G.up,rk=riskOf(seat)/2;
 if(G.round==1){const e=est(h.concat(u),u.s);return bidB(seat,e>=56-rk?u.s:-1)}
 let bs=-1,be=0;for(let s=0;s<4;s++)if(s!==u.s){const e=est(h,s);if(e>be){be=e;bs=s}}
 bidB(seat,be>=52-rk?bs:-1)}
function endRoundB(){const b=G.bid,a=b.seat%2,d=1-a,bel=[0,0];if(G.belSeen==2)bel[G.bel%2]=20;(G.seqPts||[0,0]).forEach((x,t)=>bel[t]+=x);
 const p=G.pts.map((x,t)=>x+(G.tw[t]==8?90:0)),tot=[p[0]+bel[0],p[1]+bel[1]],made=tot[a]>=91,s=[0,0];G.made=made;
 if(made){s[a]=tot[a];s[d]=tot[d]}else{s[d]=p[d]+(G.tw[d]==8?0:p[a])+bel[d];s[a]=bel[a]}
 G.sc[0]+=s[0];G.sc[1]+=s[1];
 G.res=`<b>${a===0?'Nous '+(made?'réussissons':'chutons'):'Eux '+(made?'réussissent':'chutent')}</b> (atout ${S[b.s]})<br>Plis : nous ${p[0]} · eux ${p[1]}${bel[0]+bel[1]?' · belote '+(bel[0]?'nous':'eux'):''}<br>Manche : <b>+${s[0]}</b> nous / <b>+${s[1]}</b> eux`;
 G.ph='end';G.turn=-1;G.over=0;
 if(G.sc[0]>=G.tgt||G.sc[1]>=G.tgt){G.over=1;G.res+=`<br><br><b>${G.sc[0]>=G.sc[1]?'🎉 Vous gagnez la partie !':'Les adversaires gagnent la partie.'}</b>`}
 G.msg='';render()}
function endRound(){if(G.mode==='belote')return endRoundB();const b=G.bid,a=b.seat%2,d=1-a,m=G.m,bel=[0,0];if(G.belSeen==2)bel[G.bel%2]=20;
 const p=G.pts.map((x,t)=>x+(G.tw[t]==8?90:0)),r=x=>Math.round(x/10)*10;
 const made=b.v===250?G.tw[a]==8:p[a]+bel[a]>=b.v,s=[0,0];G.made=made;
 if(made){s[a]=m>1?(b.v+160)*m:b.v===250?250:b.v+r(p[a]);s[d]=m>1?0:r(p[d])}else s[d]=(160+(b.v===250?250:b.v))*m;
 s[0]+=bel[0];s[1]+=bel[1];G.sc[0]+=s[0];G.sc[1]+=s[1];
 G.res=`<b>${a===0?'Nous':'Eux'} ${made?'réussissons':'chutons'}</b> (${b.v===250?'Capot':b.v} ${S[b.s]}${m>1?' ×'+m:''})<br>Plis : nous ${G.pts[0]+(G.tw[0]==8?90:0)} · eux ${G.pts[1]+(G.tw[1]==8?90:0)}${bel[0]+bel[1]?' · belote '+(bel[0]?'nous':'eux'):''}<br>Manche : <b>+${s[0]}</b> nous / <b>+${s[1]}</b> eux`;
 G.ph='end';G.turn=-1;
 if(G.sc[0]>=G.tgt||G.sc[1]>=G.tgt){G.over=1;G.res+=`<br><br><b>${G.sc[0]>=G.sc[1]?'🎉 Vous gagnez la partie !':'Les adversaires gagnent la partie.'}</b>`}
