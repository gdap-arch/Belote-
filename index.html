<style>

.tb::before{content:"♠ ♥ ♦ ♣";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;letter-spacing:6px;white-space:nowrap;color:rgba(255,255,255,.09);pointer-events:none}.tb::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,255,255,.2);border-radius:16px;pointer-events:none}.tc .cd{box-shadow:0 4px 7px rgba(0,0,0,.55)}#t0 .cd{transform:rotate(-3deg)}#t1 .cd{transform:rotate(5deg)}#t2 .cd{transform:rotate(-2deg)}#t3 .cd{transform:rotate(6deg)}.tb>*{position:relative}.st{position:relative}.sp{position:absolute;z-index:6;background:#fff;color:#222;font-weight:700;font-size:13px;padding:6px 11px;border-radius:14px;box-shadow:0 3px 9px rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}.sp.new{animation:pop .3s cubic-bezier(.2,1.4,.4,1)}.sp::after{content:"";position:absolute;width:10px;height:10px;background:#fff;transform:rotate(45deg)}.sp.s1{left:calc(100% - 8px);top:-4px}.sp.s1::after,.sp.s2::after{left:-4px;top:16px}.sp.s2{left:calc(50% + 30px);top:-2px}.sp.s3{right:calc(100% - 8px);top:-4px}.sp.s3::after{right:-4px;top:16px}.sp.s0{bottom:calc(100% + 4px);left:0;right:0;margin:auto;width:max-content}.sp.s0::after{bottom:-4px;left:50%;margin-left:-5px}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes i0{from{transform:translateY(80px) scale(1.15);opacity:.2}}@keyframes i1{from{transform:translateX(-80px) scale(1.15);opacity:.2}}@keyframes i2{from{transform:translateY(-80px) scale(1.15);opacity:.2}}@keyframes i3{from{transform:translateX(80px) scale(1.15);opacity:.2}}@keyframes w0{to{transform:translateY(140px) scale(.5);opacity:0}}@keyframes w1{to{transform:translateX(-140px) scale(.5);opacity:0}}@keyframes w2{to{transform:translateY(-140px) scale(.5);opacity:0}}@keyframes w3{to{transform:translateX(140px) scale(.5);opacity:0}}.in0{animation:i0 .4s ease-out}.in1{animation:i1 .4s ease-out}.in2{animation:i2 .4s ease-out}.in3{animation:i3 .4s ease-out}.sw0{animation:w0 .5s ease-in forwards}.sw1{animation:w1 .5s ease-in forwards}.sw2{animation:w2 .5s ease-in forwards}.sw3{animation:w3 .5s ease-in forwards}.st b{font-size:13px}.st em{font-size:10px;opacity:.8;font-style:normal;margin-top:-2px}.av{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #f2c230;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:box-shadow .2s}.av svg{width:100%;height:100%;display:block}.bb{background:#fff;color:#222;border-radius:9px;padding:1px 7px;font-size:11px;min-height:15px;box-sizing:border-box}.bb:empty{background:none}.st.on .av{box-shadow:0 0 0 3px #ffd54a,0 0 14px #ffd54a}.st.me{flex-direction:row;justify-content:center;gap:8px;color:var(--fg)}.st.me .bb{background:var(--pn);color:var(--fg)}
#p2{grid-column:1/4}.bk{display:flex;padding-left:6px}.bk i{width:12px;height:18px;background:repeating-linear-gradient(45deg,#1f3f7a 0 2px,#e8e8e8 2px 3px);border:1px solid #fff;border-radius:2px;margin-left:-6px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
#p1,#p3{align-self:center}
.tc{display:grid;grid-template-areas:". a ." "b e c" ". d .";grid-template-columns:1fr 1fr 1fr;grid-template-rows:46px 46px 46px;place-items:start center;padding-bottom:18px}
.cd{width:44px;height:63px;border-radius:6px;background:#fffdf6;border:1px solid #777;box-sizing:border-box;overflow:hidden;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.35)}.cd svg{width:100%;height:100%;display:block}

</style></head><body><div id="app">
<div class="top"><span id="sc"></span><span id="ct"></span><button onclick="menu()" style="padding:2px 9px" title="Changer de jeu">☰</button></div>
<div class="tb">
<div id="p2" class="st"></div>
<div id="p1" class="st"></div>
<div class="tc"><div id="t2" style="grid-area:a"></div><div id="t1" style="grid-area:b"></div><div id="te" style="grid-area:e"></div><div id="t3" style="grid-area:c"></div><div id="t0" style="grid-area:d"></div></div>
<div id="p3" class="st"></div></div>
<div id="msg"></div><div id="p0" class="st me"></div><div id="hand"></div><div id="act"></div>
</div>
<script>
const S=['♠','♥','♦','♣'],R=['7','8','9','10','V','D','R','As'];
const sT=[0,1,6,4,7,2,3,5],sP=[0,1,2,6,3,4,5,7],vT=[0,0,14,10,20,3,4,11],vP=[0,0,0,10,2,3,4,11];
const N=['Vous','Marcel','Camille','Josette'];
let G={sc:[0,0],dealer:3,h:[[],[],[],[]],log:['','','',''],say:['','','',''],lvl:1,trick:[],ph:'',turn:0,m:1};
const $=id=>document.getElementById(id);
const val=c=>c.s===G.tr?vT[c.r]:vP[c.r];
const st=c=>c.s===G.tr?10+sT[c.r]:sP[c.r];
const sortH=h=>h.sort((a,b)=>(a.s*20+(a.s===G.tr?sT[a.r]:sP[a.r]))-(b.s*20+(b.s===G.tr?sT[b.r]:sP[b.r])));
function winner(tr){let b=tr[0];const ls=tr[0].c.s,k=e=>e.c.s===G.tr?100+sT[e.c.r]:e.c.s===ls?sP[e.c.r]:-1;for(const e of tr)if(k(e)>k(b))b=e;return b}
function legal(h,tr,seat){if(!tr.length)return h;const ls=tr[0].c.s,same=h.filter(c=>c.s===ls);
 const bt=Math.max(-1,...tr.filter(e=>e.c.s===G.tr).map(e=>sT[e.c.r]));
 if(ls===G.tr){if(!same.length)return h;const hi=same.filter(c=>sT[c.r]>bt);return hi.length?hi:same}
 if(same.length)return same;
 if(winner(tr).seat%2===seat%2)return h;
 const tc=h.filter(c=>c.s===G.tr);if(!tc.length)return h;const hi=tc.filter(c=>sT[c.r]>bt);return hi.length?hi:tc}
const PIP=[[[20,22],[40,22],[20,43],[40,43],[20,64],[40,64],[30,32]],[[20,22],[40,22],[20,43],[40,43],[20,64],[40,64],[30,32],[30,54]],[[20,20],[40,20],[20,35],[40,35],[20,51],[40,51],[20,66],[40,66],[30,43]],[[20,20],[40,20],[20,35],[40,35],[20,51],[40,51],[20,66],[40,66],[30,27],[30,59]]];
function fig(r,c){const k=c==='#c4161c'?'#c4161c':'#1f4e9c',g='#e8b923';
 const hat=r==6?`<path d="M24 22L25 14L28 18L30 13L32 18L35 14L36 22Z" fill="${g}" stroke="#a37f10" stroke-width=".6"/>`:r==5?`<path d="M25 21L27 16L30 20L33 16L35 21Z" fill="${g}" stroke="#a37f10" stroke-width=".6"/>`:`<path d="M23 23Q30 10 38 22Z" fill="${k}"/><path d="M37 19Q46 11 43 24" fill="none" stroke="${g}" stroke-width="1.6"/>`;
 const h=`<path d="M14 43Q15 32 30 31Q45 32 46 43Z" fill="${k}"/><path d="M26 31L30 37L34 31Z" fill="#fff"/>${r==5?'<ellipse cx="30" cy="27" rx="8" ry="9" fill="#6b4423"/>':''}<circle cx="30" cy="26.5" r="5.5" fill="#f3d2a8" stroke="#8a5a2b" stroke-width=".5"/>${r==6?'<path d="M25 28Q30 36 35 28Q30 31 25 28Z" fill="#ccc"/>':''}${hat}<circle cx="28" cy="26" r=".7"/><circle cx="32" cy="26" r=".7"/>`;
 return `<rect x="14" y="14" width="32" height="58" fill="#fff6dc" stroke="${c}" stroke-width="1"/><g>${h}</g><g transform="rotate(180 30 43)">${h}</g>`}
function fig2(r,c,sy){const red=c==='#c4161c',k=red?'#c8202f':'#1d4f9b',k2=red?'#1d4f9b':'#c8202f',g='#f2c230',gd='#8a6a0a',sk='#f6d9b8',o='#222',hair=r==6?'#a8a8a8':'#6b3f1d';
 const sx=r==6?41:19;let a='';
 if(r==6)a=`<path d="M19 43V23" stroke="${gd}" stroke-width="1.4"/><circle cx="19" cy="22" r="2" fill="${g}" stroke="${gd}" stroke-width=".5"/>`;
 else if(r==5)a=`<path d="M41 43V28" stroke="#2e7d32" stroke-width="1"/><circle cx="41" cy="26" r="2.6" fill="${k2}" stroke="${o}" stroke-width=".4"/><circle cx="41" cy="26" r="1" fill="${g}"/>`;
 else a=`<path d="M41 43V19" stroke="#555" stroke-width="1.1"/><path d="M41 19L45 22L41 27Z" fill="#ccc" stroke="${o}" stroke-width=".4"/>`;
 const body=`<path d="M15 43L16 37Q18 31 25 30L35 30Q42 31 44 37L45 43Z" fill="${k}" stroke="${o}" stroke-width=".5"/><path d="M30 30L35 30Q42 31 44 37L45 43L30 43Z" fill="${k2}"/><path d="M15 40.5H45" stroke="${g}" stroke-width="2.2"/><path d="M30 31V43" stroke="${g}" stroke-width="1"/>`;
 const col=r==4?`<path d="M21 31Q30 38 39 31L37 30Q30 35 23 30Z" fill="${g}" stroke="${gd}" stroke-width=".4"/>`:`<path d="M21 31Q30 38 39 31L37 30Q30 35 23 30Z" fill="#fff" stroke="${o}" stroke-width=".4"/><circle cx="26" cy="32.2" r=".6"/><circle cx="30" cy="34" r=".6"/><circle cx="34" cy="32.2" r=".6"/>`;
 const hb=r==6?`<path d="M25.5 27Q30 33.5 34.5 27Q33 36.5 30 36.5Q27 36.5 25.5 27Z" fill="${hair}" stroke="${o}" stroke-width=".3"/>`:r==5?`<path d="M23 21Q21 33 26 37L27 27ZM37 21Q39 33 34 37L33 27Z" fill="${hair}"/>`:`<path d="M24 21Q23 28 25 31L27 25ZM36 21Q37 28 35 31L33 25Z" fill="${hair}"/>`;
 const face=`<ellipse cx="30" cy="25.5" rx="5" ry="5.8" fill="${sk}" stroke="#7a4a22" stroke-width=".5"/><circle cx="28" cy="24.5" r=".7"/><circle cx="32" cy="24.5" r=".7"/><path d="M30 25.5L29.2 27.8L30.8 27.8" fill="none" stroke="#a86a3a" stroke-width=".4"/>`+(r==6?`<path d="M27.5 29Q30 27.6 32.5 29Q30 30.2 27.5 29Z" fill="${hair}"/>`:`<path d="M28.6 29.6Q30 30.6 31.4 29.6" fill="none" stroke="#b02a2a" stroke-width=".6"/>`);
 const hat=r==6?`<path d="M24 19.5L24 13L27 16L30 11.5L33 16L36 13L36 19.5Z" fill="${g}" stroke="${gd}" stroke-width=".6"/><path d="M24 17.8H36" stroke="${gd}" stroke-width=".5"/><circle cx="30" cy="14.5" r=".9" fill="${k}"/><circle cx="27" cy="18.7" r=".7" fill="${k2}"/><circle cx="33" cy="18.7" r=".7" fill="${k2}"/>`:r==5?`<path d="M24 24Q23 14 30 14Q37 14 36 24Q33 18 30 18Q27 18 24 24Z" fill="${hair}"/><path d="M25 18.5L25 14.5L27.5 16.5L30 13L32.5 16.5L35 14.5L35 18.5Z" fill="${g}" stroke="${gd}" stroke-width=".5"/><circle cx="30" cy="14" r=".8" fill="${k}"/>`:`<path d="M23 21Q22 11 32 11.5Q40 12 37 20.5Q30 17 23 21Z" fill="${k}" stroke="${o}" stroke-width=".4"/><path d="M36 13Q46 9 44 20Q42 14 36 13Z" fill="${g}" stroke="${gd}" stroke-width=".4"/>`;
 const sym=`<text x="${sx}" y="18" font-size="8" text-anchor="middle" dominant-baseline="central" fill="${c}">${sy}</text>`;
 const half=a+body+col+hb+face+hat+sym;
 return `<rect x="14" y="10" width="32" height="66" fill="#fbf0cf" stroke="${o}" stroke-width=".7"/><rect x="15.5" y="11.5" width="29" height="63" fill="none" stroke="${k}" stroke-width=".4"/><g>${half}</g><g transform="rotate(180 30 43)">${half}</g><path d="M14 43H46" stroke="${o}" stroke-width=".4"/>`}
const AV=[{bg:'#4a90d9',sk:'#f1c9a0',hr:'#4b2e1a',sh:'#2c5d9e'},{bg:'#d08a45',sk:'#e8bb92',hr:'#e6e6e6',sh:'#7a3b2a'},{bg:'#58a58a',sk:'#f6d3b3',hr:'#a0481f',sh:'#c8553d'},{bg:'#b4639a',sk:'#f0c8a0',hr:'#9a9a9a',sh:'#3f6b8a'}];
function av(i){const a=AV[i],hr=[
 `<path d="M12 20Q12 8 22 8Q32 8 32 20Q28 14 22 14Q16 14 12 20Z" fill="${a.hr}"/>`,
 `<path d="M13 20Q13 11 22 11Q31 11 31 20Q27 15 22 15Q17 15 13 20Z" fill="${a.hr}"/><path d="M9 13Q22 1 35 13Q22 10 9 13Z" fill="#2b2b2b"/>`,
 `<path d="M12 38Q8 14 22 8Q36 14 32 38L29 31L29 21Q22 14 15 21L15 31Z" fill="${a.hr}"/>`,
 `<circle cx="22" cy="8" r="4.5" fill="${a.hr}"/><path d="M12 21Q12 9 22 9Q32 9 32 21Q28 14 22 14Q16 14 12 21Z" fill="${a.hr}"/>`][i];
 const ex=[`<path d="M18 28Q22 31 26 28" fill="none" stroke="#a33" stroke-width="1.2"/>`,`<path d="M17 27Q22 25 27 27Q22 29 17 27Z" fill="#ddd"/>`,`<path d="M18 28Q22 31 26 28" fill="none" stroke="#c33" stroke-width="1.2"/>`,`<circle cx="18.5" cy="22" r="3.2" fill="none" stroke="#333" stroke-width=".8"/><circle cx="25.5" cy="22" r="3.2" fill="none" stroke="#333" stroke-width=".8"/><path d="M18 28Q22 30.5 26 28" fill="none" stroke="#a33" stroke-width="1.2"/>`][i];
 return `<svg viewBox="0 0 44 44"><rect width="44" height="44" fill="${a.bg}"/><path d="M5 44Q7 33 22 32Q37 33 39 44Z" fill="${a.sh}"/><rect x="19" y="28" width="6" height="6" fill="${a.sk}"/><circle cx="22" cy="21" r="9.5" fill="${a.sk}"/>${hr}<circle cx="18.5" cy="22" r="1.1" fill="#222"/><circle cx="25.5" cy="22" r="1.1" fill="#222"/>${ex}</svg>`}
function cardEl(c,x='',i=''){const col=c.s==1||c.s==2?'#c4161c':'#111',sy=S[c.s]+'\uFE0E',tx=(X,Y,s)=>`<text x="${X}" y="${Y}" font-size="${s}" text-anchor="middle" dominant-baseline="central" fill="${col}">${sy}</text>`;
 const ix=`<text x="7" y="9" font-size="11" font-weight="700" font-family="Georgia,serif" text-anchor="middle" dominant-baseline="central" fill="${col}">${R[c.r]}</text>${tx(7,20,10)}`;
 let b='';if(c.r<4)b=PIP[c.r].map(([X,Y])=>`<g transform="rotate(${Y>43?180:0} ${X} ${Y})">${tx(X,Y,13)}</g>`).join('');else if(c.r==7)b=tx(30,43,36);else b=fig2(c.r,col,sy);
 return `<div class="cd ${x}" ${i!==''?`onclick="hp(${i})"`:''}><svg viewBox="0 0 60 86">${b}${ix}<g transform="rotate(180 30 43)">${ix}</g></svg></div>`}
function render(){const g=G,ph=g.ph;
 $('sc').innerHTML=`Nous <b>${g.sc[0]}</b> · Eux <b>${g.sc[1]}</b> <small>(${g.mode==='belote'?501:1000}) ${['Facile','Moyen','Expert'][g.lvl]||''}</small>`;
 $('ct').textContent=g.bid&&ph!=='bid'?`${g.mode==='belote'?'Atout':g.bid.v===250?'Capot':g.bid.v} ${S[g.bid.s]} · ${N[g.bid.seat]}${g.m>1?' · '+(g.m==2?'coinché':'surcoinché'):''}`:ph==='bid'?'Enchères':'';
 [0,1,2,3].forEach(i=>{const e=$('p'+i),t=ph==='bid'?g.log[i]:(g.bid&&g.bid.seat===i?'🎯 Preneur':'');
  e.className='st'+(i?'':' me')+(g.turn===i&&ph!=='end'?' on':'');
  e.innerHTML=(g.say[i]?`<div class="sp s${i}${g.sayNew===i?' new':''}">${g.say[i]}</div>`:'')+`<div class="av">${av(i)}</div><b>${N[i]}</b>${i===2?'<em>partenaire</em>':''}<small class="bb">${t}</small>`+(i?`<div class="bk">${'<i></i>'.repeat(g.h[i].length)}</div>`:'')});
 for(let s=0;s<4;s++){const e=g.trick.find(x=>x.seat===s);$('t'+s).innerHTML=e?cardEl(e.c,(e===g.fresh?'in'+s:'')+(g.sweep>=0?' sw'+g.sweep:'')):'<div class="sl"></div>'}
 $('te').innerHTML=g.mode==='belote'&&g.up&&ph==='bid'?cardEl(g.up):'';
 const myTurn=ph==='play'&&g.turn===0&&g.trick.length<4,L=myTurn?legal(g.h[0],g.trick,0):[];
 $('hand').innerHTML=g.h[0].map((c,i)=>cardEl(c,myTurn?(L.includes(c)?'ok':'no'):'',i)).join('');
 $('msg').textContent=g.msg||(myTurn?'À vous de jouer':ph==='bid'&&g.turn===0?'À vous d’annoncer':'');
 let a='';
 if(ph==='bid'&&g.turn===0&&g.mode==='belote')a=(g.round==1?`<button class="p" onclick="hbB(${g.up.s})">Je prends ${S[g.up.s]}</button>`:[0,1,2,3].filter(s=>s!==g.up.s).map(s=>`<button class="s" style="color:${s==1||s==2?'#c4161c':'inherit'}" onclick="hbB(${s})">${S[s]}</button>`).join(''))+`<button onclick="hbB(-1)">Passe</button>`;
 else if(ph==='bid'&&g.turn===0){const cur=g.bid?g.bid.v:0,vs=[80,90,100,110,120,130,140,150,160,250].filter(v=>v>cur);
  a=`<select id="bv">${vs.map(v=>`<option value="${v}">${v===250?'Capot':v}</option>`).join('')}</select>`+S.map((s,i)=>`<button class="s" style="color:${i==1||i==2?'#c4161c':'inherit'}" onclick="hb(${i})">${s}</button>`).join('')+`<button onclick="hb(-1)">Passe</button>`}
 else if(ph==='menu')a=`<div style="width:100%;text-align:center;font-weight:600">Difficulté</div>`+['Facile','Moyen','Expert'].map((n,i)=>`<button class="${g.lvl==i?'p':''}" onclick="setLvl(${i})">${n}</button>`).join('')+`<div style="width:100%;text-align:center;font-weight:600;margin-top:6px">Jeu</div><button style="font-size:17px;padding:10px 22px" onclick="setMode('belote')">Belote</button><button style="font-size:17px;padding:10px 22px" onclick="setMode('coinche')">Coinche</button>`;
 else if(ph==='co')a=`<button class="p" onclick="co(1)">Coincher (×2)</button><button onclick="co(0)">Jouer</button>`;
 else if(ph==='sur')a=`<button class="p" onclick="co(1)">Surcoincher (×4)</button><button onclick="co(0)">Jouer</button>`;
 else if(ph==='end')a=`<div style="width:100%;text-align:center">${g.res}</div><button class="p" onclick="${g.over?'restart()':'newRound()'}">${g.over?'Nouvelle partie':'Manche suivante'}</button>`;
 else a='<small>Contrat à l’atout · 162 points · belote-rebelote +20</small>';
 $('act').innerHTML=a;g.fresh=null;g.sayNew=-1}
function newRound(){const d=[];for(let s=0;s<4;s++)for(let r=0;r<8;r++)d.push({s,r});
 for(let i=31;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 G.tr=null;G.round=1;G.up=null;const nb=G.mode==='belote'?5:8;G.h=[0,1,2,3].map(i=>sortH(d.slice(i*nb,i*nb+nb)));if(nb==5){G.up=d[20];G.rest=d.slice(21)}G.dealer=(G.dealer+1)%4;G.bid=null;G.pass=0;G.log=['','','',''];G.ph='bid';G.turn=(G.dealer+1)%4;G.m=1;G.trick=[];G.msg='';G.over=0;render();next()}
function restart(){menu()}
function say(seat,t,ms=2600){G.say[seat]=t;G.sayNew=seat;setTimeout(()=>{if(G.say[seat]===t){G.say[seat]='';const b=document.querySelector('#p'+seat+' .sp');if(b)b.remove()}},ms)}
function next(){if(G.ph==='bid'){if(G.turn!==0)setTimeout(()=>botBid(G.turn),1800)}
 else if(G.ph==='play'&&G.turn!==0&&G.trick.length<4)setTimeout(()=>botPlay(G.turn),1300)}
function est(h,s){let e=10,n=0;h.forEach(c=>{if(c.s===s){e+=vT[c.r];n++}else if(c.r===7)e+=10});
 if(h.some(c=>c.s===s&&c.r===5)&&h.some(c=>c.s===s&&c.r===6))e+=20;return e+Math.max(0,n-3)*8}
function riskOf(seat){if(G.lvl==0)return -10;const t=seat%2,d=G.sc[t]-G.sc[1-t];let r=d<-250?20:d<-100?10:d>250?-10:0;if(G.sc[1-t]>=800)r+=10;if(Math.random()<.3)r+=10;return r}
function coincheP(s,b){if(G.lvl==0)return 0;const h=G.h[s],t=h.filter(c=>c.s===b.s),j=t.some(c=>c.r===4),n9=t.some(c=>c.r===2),as=h.filter(c=>c.s!==b.s&&c.r===7).length,d=G.sc[s%2]-G.sc[1-s%2];
 let p=j&&n9?.85:(j||n9)&&t.length>=3?.3:t.length>=4?.2:0;p+=as>=2?.1:0;p+=b.v>=130?.1:0;p+=d<-200?.1:0;if(d>300)p-=.1;if(G.lvl==2&&p<.2)p=0;return p}
function surP(s){const h=G.h[s],t=h.filter(c=>c.s===G.tr);return hasJ9(h,G.tr)||(t.some(c=>c.r===4)&&t.length>=4&&Math.random()<.5)}
function botBid(seat){if(G.mode==='belote')return botBidB(seat);if(G.lvl==0&&Math.random()<.2)return bid(seat,0,0);const h=G.h[seat],cur=G.bid,pt=!!cur&&cur.seat%2===seat%2,rk=riskOf(seat),E=[0,1,2,3].map(s=>{let e=est(h,s)+(G.lvl==2?5*[0,1,2,3].filter(x=>x!==s&&h.some(c=>c.s===x&&c.r===7)&&h.some(c=>c.s===x&&c.r===3)).length:0);if(pt&&cur.s===s&&h.some(c=>c.s===s&&(c.r===4||c.r===2)))e+=10;return e});
 let bs=E.indexOf(Math.max(...E));if(pt&&E[cur.s]>=E[bs]-10)bs=cur.s;
 const raw=E[bs],b=Math.min(160,Math.floor((raw+rk)/10)*10);
 if(raw>=215&&G.lvl>0)return bid(seat,250,bs);
 if(!cur){if(b<80)return bid(seat,0,0);return bid(seat,b>=130?100:b>=110?90:80,bs)}
 const need=cur.v+10;
 if(b<need||b<80||(pt&&b<cur.v+10)||(pt&&bs!==cur.s&&b<cur.v+20))return bid(seat,0,0);
 bid(seat,b>=cur.v+30&&G.lvl>0?cur.v+20:need,bs)}
function botBidOld(seat){const h=G.h[seat],cur=G.bid;let b=0,bs=0;for(let s=0;s<4;s++){const e=est(h,s);if(e>b){b=e;bs=s}}
 b=Math.min(160,Math.floor(b/10)*10);const need=cur?cur.v+(cur.seat%2===seat%2?20:10):80;
 if(b>=need&&b>=80)bid(seat,cur?cur.v+10:80,bs);else bid(seat,0,0)}
function hb(s){if(s<0)return bid(0,0,0);bid(0,+$('bv').value,s)}
function bid(seat,v,s){if(!v){G.log[seat]='Passe';G.pass++;say(seat,['Je passe','Passe !','Pas pour moi','Rien à dire','Je passe…'][Math.random()*5|0])}else{G.bid={v,s,seat};G.pass=0;G.log[seat]=(v===250?'Capot':v)+' '+S[s];say(seat,v===250?'Capot !':v+' '+S[s])}
 if(G.bid&&(G.pass>=3||v===250))return endBid();
 if(!G.bid&&G.pass>=4){G.msg='Tout le monde passe : on redistribue';render();return void setTimeout(newRound,2600)}
 G.turn=(G.turn+1)%4;render();next()}
const hasJ9=(h,s)=>h.some(c=>c.s===s&&c.r===4)&&h.some(c=>c.s===s&&c.r===2);
function endBid(){const b=G.bid;G.tr=b.s;G.h.forEach(sortH);G.ph='co';G.m=1;
 if(b.seat%2===1){G.msg='Coincher '+(b.v===250?'le capot':b.v+' '+S[b.s])+' ?';render();return}
 const cs=[1,3].find(s=>coincheP(s,b)>Math.random());
 if(cs!==undefined){G.m=2;say(cs,'Coinche !',3200);G.ph='sur';G.msg='Les adversaires coinchent ! Surcoincher ?';render();return}
 startPlay()}
function co(y){if(G.ph==='co'){if(y){G.m=2;G.msg='Coinché !';say(0,'Coinche !',3000);if(surP(G.bid.seat)){G.m=4;G.msg='Coinché… et surcoinché !';say(G.bid.seat,'Surcoinche !',3000)}}}else if(y){G.m=4;G.msg='Surcoinché !';say(0,'Surcoinche !',3000)}startPlay()}
function startPlay(){G.ph='play';G.seen=new Set();G.pts=[0,0];G.tw=[0,0];G.trick=[];G.tp=0;G.belSeen=0;G.turn=(G.dealer+1)%4;
 G.bel=[0,1,2,3].find(s=>G.h[s].some(c=>c.s===G.tr&&c.r===5)&&G.h[s].some(c=>c.s===G.tr&&c.r===6));if(G.bel===undefined)G.bel=-1;
 render();next()}
function hp(i){if(G.ph!=='play'||G.turn!==0||G.trick.length>=4)return;const c=G.h[0][i];if(legal(G.h[0],G.trick,0).includes(c))play(0,c)}
function play(seat,c){G.msg='';G.h[seat].splice(G.h[seat].indexOf(c),1);const en={seat,c};G.fresh=en;G.trick.push(en);
 G.seen.add(c.s*8+c.r);if(c.s===G.tr)G.tp++;
 if(seat===G.bel&&c.s===G.tr&&(c.r===5||c.r===6)){G.belSeen++;G.msg=N[seat]+' : '+(G.belSeen==1?'Belote !':'Rebelote !');say(seat,G.belSeen==1?'Belote !':'Rebelote !',2400)}
 if(G.trick.length===4){render();return void setTimeout(endTrick,1900)}
 G.turn=(G.turn+1)%4;render();next()}
function endTrick(){const w=winner(G.trick),t=w.seat%2;G.pts[t]+=G.trick.reduce((a,e)=>a+val(e.c),0);G.tw[t]++;G.sweep=w.seat;G.turn=w.seat;render();
 setTimeout(()=>{G.sweep=-1;G.trick=[];if(!G.h[0].length){G.pts[t]+=10;return endRound()}render();next()},550)}
function botPlay(seat){const h=G.h[seat],L=legal(h,G.trick,seat),tr=G.trick,att=G.bid.seat%2===seat%2,T=G.tr;let c;
 const lo=a=>a.reduce((x,y)=>st(y)<st(x)?y:x),hi=a=>a.reduce((x,y)=>st(y)>st(x)?y:x),
 lv=a=>a.reduce((x,y)=>val(y)<val(x)||(val(y)==val(x)&&st(y)<st(x))?y:x),mv=a=>a.reduce((x,y)=>val(y)>val(x)?y:x),
 nt=L.filter(x=>x.s!==T),out=s=>[0,1,2,3,4,5,6,7].filter(r=>(G.lvl==0||!G.seen.has(s*8+r))&&!h.some(k=>k.s===s&&k.r===r)),
 mast=x=>out(x.s).every(r=>(x.s===T?sT[r]:sP[r])<(x.s===T?sT[x.r]:sP[x.r]));
 if(!tr.length){const t=L.filter(x=>x.s===T),m=nt.filter(mast);
  if(att&&t.length&&out(T).length&&(mast(hi(t))||(t.length>=3&&Math.random()<.6)))c=hi(t);
  else if(m.length)c=mv(m);
  else c=nt.length?lo(nt):lo(L)}
 else{const w=winner(tr),pw=w.seat%2===seat%2,last=tr.length===3;
  if(pw){const p=nt.length?nt:L;c=(last||(mast(w.c)&&(G.lvl<2||w.c.s===T||!out(T).length)))?mv(p):lv(p)}
  else{const win=L.filter(x=>winner([...tr,{seat,c:x}]).seat===seat);c=win.length?lo(win):lv(nt.length?nt:L)}}
 if(G.lvl==0&&Math.random()<.2)c=L[Math.random()*L.length|0];
 play(seat,c)}
function botPlayOld(seat){const h=G.h[seat],L=legal(h,G.trick,seat),tr=G.trick,att=G.bid.seat%2===seat%2;let c;
 const lo=a=>a.reduce((x,y)=>st(y)<st(x)?y:x),hi=a=>a.reduce((x,y)=>st(y)>st(x)?y:x),
 lv=a=>a.reduce((x,y)=>val(y)<val(x)||(val(y)==val(x)&&st(y)<st(x))?y:x),nt=L.filter(x=>x.s!==G.tr);
 if(!tr.length){const t=L.filter(x=>x.s===G.tr),as=nt.filter(x=>x.r===7);
  if(att&&t.length&&G.tp<5)c=hi(t);else if(as.length)c=as[0];else c=nt.length?lo(nt):lo(L)}
 else if(winner(tr).seat%2===seat%2){const p=nt.length?nt:L;c=p.reduce((x,y)=>val(y)>val(x)?y:x)}
 else{const win=L.filter(x=>winner([...tr,{seat,c:x}]).seat===seat);c=win.length?lo(win):lv(nt.length?nt:L)}
 play(seat,c)}
function menu(){G.ph='menu';G.msg='Choisis la difficulté et le jeu';G.turn=-1;G.bid=null;G.trick=[];G.h=[[],[],[],[]];G.sc=[0,0];G.up=null;G.log=['','','',''];render()}
function setMode(m){G.mode=m;G.sc=[0,0];G.dealer=3;newRound()}
function hbB(s){bidB(0,s)}
function setLvl(i){G.lvl=i;render()}
function bidB(seat,s){
 if(s<0){G.log[seat]='Passe';G.pass++;say(seat,['Je passe','Passe !','Pas pour moi','Rien à dire'][Math.random()*4|0]);
  if(G.pass>=4){if(G.round==1){G.round=2;G.pass=0;G.turn=(G.dealer+1)%4;G.log=['','','',''];G.msg='Deuxième tour : choisissez une autre couleur';render();return next()}
   G.msg='Tout le monde passe : on redistribue';render();return void setTimeout(newRound,2600)}}
 else{G.bid={v:0,s,seat};G.log[seat]='Prend '+S[s];say(seat,G.round==1?'Je prends !':'Je prends '+S[s]);return takeB()}
 G.turn=(G.turn+1)%4;render();next()}
function takeB(){const b=G.bid,h=G.h;h[b.seat].push(G.up,...G.rest.slice(0,2));let k=2;for(let i=1;i<4;i++){h[(b.seat+i)%4].push(...G.rest.slice(k,k+3));k+=3}
 G.tr=b.s;G.m=1;G.msg='';G.h.forEach(sortH);G.ph='deal';G.turn=-1;render();setTimeout(startPlay,1500)}
function botBidB(seat){if(G.lvl==0&&Math.random()<.2)return bidB(seat,-1);const h=G.h[seat],u=G.up,rk=riskOf(seat)/2;
 if(G.round==1){const e=est(h.concat(u),u.s);return bidB(seat,e>=56-rk?u.s:-1)}
 let bs=-1,be=0;for(let s=0;s<4;s++)if(s!==u.s){const e=est(h,s);if(e>be){be=e;bs=s}}
 bidB(seat,be>=52-rk?bs:-1)}
function endRoundB(){const b=G.bid,a=b.seat%2,d=1-a,bel=[0,0];if(G.belSeen==2)bel[G.bel%2]=20;
 const p=G.pts.map((x,t)=>x+(G.tw[t]==8?90:0)),tot=[p[0]+bel[0],p[1]+bel[1]],made=tot[a]>=91,s=[0,0];
 if(made){s[a]=tot[a];s[d]=tot[d]}else{s[d]=p[d]+(G.tw[d]==8?0:p[a])+bel[d];s[a]=bel[a]}
 G.sc[0]+=s[0];G.sc[1]+=s[1];
 G.res=`<b>${a===0?'Nous '+(made?'réussissons':'chutons'):'Eux '+(made?'réussissent':'chutent')}</b> (atout ${S[b.s]})<br>Plis : nous ${p[0]} · eux ${p[1]}${bel[0]+bel[1]?' · belote '+(bel[0]?'nous':'eux'):''}<br>Manche : <b>+${s[0]}</b> nous / <b>+${s[1]}</b> eux`;
 G.ph='end';G.turn=-1;G.over=0;
 if(G.sc[0]>=501||G.sc[1]>=501){G.over=1;G.res+=`<br><br><b>${G.sc[0]>=G.sc[1]?'🎉 Vous gagnez la partie !':'Les adversaires gagnent la partie.'}</b>`}
 G.msg='';render()}
function endRound(){if(G.mode==='belote')return endRoundB();const b=G.bid,a=b.seat%2,d=1-a,m=G.m,bel=[0,0];if(G.belSeen==2)bel[G.bel%2]=20;
 const p=G.pts.map((x,t)=>x+(G.tw[t]==8?90:0)),r=x=>Math.round(x/10)*10;
 const made=b.v===250?G.tw[a]==8:p[a]+bel[a]>=b.v,s=[0,0];
 if(made){s[a]=m>1?(b.v+160)*m:b.v===250?250:b.v+r(p[a]);s[d]=m>1?0:r(p[d])}else s[d]=(160+(b.v===250?250:b.v))*m;
 s[0]+=bel[0];s[1]+=bel[1];G.sc[0]+=s[0];G.sc[1]+=s[1];
 G.res=`<b>${a===0?'Nous':'Eux'} ${made?'réussissons':'chutons'}</b> (${b.v===250?'Capot':b.v} ${S[b.s]}${m>1?' ×'+m:''})<br>Plis : nous ${G.pts[0]+(G.tw[0]==8?90:0)} · eux ${G.pts[1]+(G.tw[1]==8?90:0)}${bel[0]+bel[1]?' · belote '+(bel[0]?'nous':'eux'):''}<br>Manche : <b>+${s[0]}</b> nous / <b>+${s[1]}</b> eux`;
